# النشر التلقائي على Firebase Hosting عند أي تعديل على الفرع main
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches: [main]
permissions:
  contents: read
  checks: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSEWARES_CATALOG_ADEL }}
          channelId: live
          projectId: housewares-catalog-adel
